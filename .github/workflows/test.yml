name: SONATA release checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.14']
      fail-fast: false
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/sync_examples.py --check
      - run: python -m pytest -q
      - run: python scripts/build.py
      - run: python scripts/v1_demos.py
      - run: python scripts/check_artifacts.py
      - run: python -m pip install -r requirements-build.txt
      - run: python -m build --no-isolation
      - run: python scripts/package_smoke.py dist/sonata_lang-1.0.0-py3-none-any.whl
