[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "sonata-lang"
version = "1.0.0"
description = "An executable musical programming language and audible debugger"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "mido==1.3.3"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
  "Topic :: Software Development :: Debuggers",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]
midi = ["python-rtmidi>=1.5.8,<2"]

[project.urls]
Repository = "https://github.com/NoahWLono/sonata"
Documentation = "https://github.com/NoahWLono/sonata/blob/main/docs/TUTORIAL.md"
Issues = "https://github.com/NoahWLono/sonata/issues"

[project.scripts]
sonata = "sonata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonata = ["web/*", "examples/*", "examples/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
